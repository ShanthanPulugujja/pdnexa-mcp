<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="pdnexa">
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B794FF"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="loop" x1="0.15" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E3A8A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Soft product tile matching screenshot backdrop -->
  <rect width="1024" height="1024" rx="220" fill="#D6E8FF"/>

  <g filter="url(#soft)" transform="translate(512 512) scale(1.05) translate(-512 -512)">
    <!-- Vertical capsule (P stem) -->
    <rect x="286" y="214" width="168" height="596" rx="84" fill="url(#stem)"/>

    <!-- Circular bowl of the P (thick ring) -->
    <circle cx="560" cy="392" r="236" fill="none" stroke="url(#loop)" stroke-width="168" stroke-linecap="round"/>
  </g>
</svg>
